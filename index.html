<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Killer Pool</title>

<style>
:root{
  --felt1:#35d0a5;
  --felt2:#1ea97f;
}

* { box-sizing: border-box; }

body{
  margin:0;
  min-height:100vh;
  display:flex;
  justify-content:center;
  background: linear-gradient(180deg, var(--felt1), var(--felt2));
  font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  color:#fff;
  padding:20px;
}

.frame{
  width:min(600px,100%);
  text-align:center;
}

h1{
  font-size:42px;
  margin-bottom:10px;
  text-shadow:0 5px 20px rgba(0,0,0,.3);
}

.rail{
  background:rgba(255,255,255,.2);
  border-radius:20px;
  padding:20px;
  backdrop-filter: blur(6px);
}

input,button{
  width:90%;
  max-width:340px;
  padding:12px;
  margin:6px 0;
  font-size:18px;
  border-radius:14px;
  border:none;
}

input{
  background:#ffffffdd;
  color:#111;
}

button{
  font-weight:800;
  cursor:pointer;
}

.secondary{ background:#3d98db; color:white; }
.play{ background:#2ecc71; }
.miss{ background:#e67e22; }
.pot{ background:#1abc9c; }
.black{ background:#111; color:white; }
.whiteball{ background:white; color:black; }

.nameBig{
  font-size:48px;
  font-weight:900;
  margin:10px 0;
}

.card{
  font-size:80px;
  margin:20px 0;
}

.btnRow{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:10px;
}

.btnRow button{
  width:45%;
}

/* Alerts */
#deckOverlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  z-index:3000;
  align-items:center;
  justify-content:center;
}

#deckText{
  font-size:60px;
  font-weight:900;
  text-transform:uppercase;
  color:white;
}

</style>
</head>

<body>

<div class="frame">
<h1>🎱 Killer Pool</h1>

<div class="rail">

<div id="setup">
  <div id="playerList"></div>
  <button class="secondary" onclick="addPlayer()">➕ Add Player</button>
  <button onclick="drawCards()">🎴 Draw Cards</button>
  <div id="results"></div>
  <button id="startBtn" class="play" onclick="startGame()" style="display:none;">▶️ Play Game</button>
</div>

<div id="game" style="display:none;">
  <div class="nameBig" id="currentName"></div>
  <div class="card" id="cardDisplay">A</div>

  <div class="btnRow">
    <button class="miss" onclick="doAction('miss')">❌ Miss</button>
    <button class="pot" onclick="doAction('pot')">🎯 Pot</button>
    <button class="black" onclick="doAction('black')">⚫ Black</button>
    <button class="whiteball" onclick="doAction('white')">⚪ White</button>
  </div>
</div>

</div>
</div>

<div id="deckOverlay">
  <div id="deckText">RESHUFFLE</div>
</div>

<script>
const baseDeck=["A","K","Q","J","10","9","8","7","6","5","4","3","2"];

let players=[];
let activePlayers=[];
let currentIdx=null;

let drawPile=[];
let recyclePile=[];
let deadPile=[];

function shuffle(arr){
  return arr.sort(()=>Math.random()-0.5);
}

function addPlayer(){
  const input=document.createElement("input");
  input.placeholder="Player name";
  document.getElementById("playerList").appendChild(input);
}

function drawCards(){
  players=[];
  activePlayers=[];
  const names=[...document.querySelectorAll("#playerList input")]
    .map(i=>i.value.trim()).filter(Boolean);

  if(!names.length) return alert("Enter at least 1 player");

  const deck=shuffle([...baseDeck]);
  const dealt=[];

  names.forEach(n=>{
    const card=deck.pop();
    dealt.push(card);
    players.push({name:n,card,lives:3,extras:[]});
  });

  drawPile=shuffle(deck);
  recyclePile=[];
  deadPile=[];

  document.getElementById("results").innerHTML=
    names.map((n,i)=>`${n} — ${players[i].card}`).join("<br>");

  document.getElementById("startBtn").style.display="inline-block";
}

function startGame(){
  activePlayers=players.map((_,i)=>i);
  document.getElementById("setup").style.display="none";
  document.getElementById("game").style.display="block";
  nextTurn();
}

function nextTurn(){
  if(activePlayers.length===1){
    const w=players[activePlayers[0]];
    document.getElementById("currentName").textContent="🏆 "+w.name+" WINS";
    document.getElementById("cardDisplay").textContent=w.card;
    return;
  }

  currentIdx=activePlayers[Math.floor(Math.random()*activePlayers.length)];
  const p=players[currentIdx];
  document.getElementById("currentName").textContent=p.name+" ("+p.lives+" lives)";
  document.getElementById("cardDisplay").textContent=p.card;
}

function showAlert(text){
  const o=document.getElementById("deckOverlay");
  document.getElementById("deckText").textContent=text;
  o.style.display="flex";
  setTimeout(()=>o.style.display="none",1000);
}

function drawSpare(){
  if(drawPile.length===0){
    if(recyclePile.length>0){
      showAlert("RESHUFFLE");
      drawPile=shuffle(recyclePile);
      recyclePile=[];
    } else {
      showAlert("ALL CARDS IN PLAY");
      return null;
    }
  }
  return drawPile.pop();
}

function doAction(type){
  const p=players[currentIdx];

  if(type==="miss"){
    p.lives--;
    deadPile.push("dead");
  }

  if(type==="white"){
    p.lives--;
    deadPile.push("dead");
  }

  if(type==="pot"){
    recyclePile.push(p.card);
    const newCard=drawSpare();
    if(newCard) p.card=newCard;
  }

  if(type==="black"){
    const spare=drawSpare();
    if(spare){
      p.lives++;
      p.extras.push(spare);
    }
  }

  if(p.lives<=0){
    activePlayers=activePlayers.filter(i=>i!==currentIdx);
  }

  nextTurn();
}

addPlayer();
addPlayer();
</script>

</body>
</html>
